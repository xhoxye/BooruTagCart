<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小河的 Danbooru 标签助手 2.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f7ff 100%);
            min-height: 100vh;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .tag-selected {
            filter: grayscale(80%);
            transform: scale(0.95);
            box-shadow: none;
        }
        .tag-selected::after {
            content: '✔';
            position: absolute;
            top: 4px;
            right: 4px;
            background-color: #3b82f6;
            color: white;
            border-radius: 9999px;
            width: 18px;
            height: 18px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            line-height: 1;
            box-shadow: 0 0 0 2px white;
        }
        .sortable-ghost {
            opacity: 0.4;
            background: #c0e3f5;
            outline: 2px dashed #3b82f6;
            outline-offset: -4px;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #e5e7eb;
        }
        .tag-item {
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative; /* For positioning the badge */
        }
        .tag-item:hover {
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        .category-btn {
            transition: all 0.2s ease;
        }
        .format-btn {
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
            font-weight: 500;
            border: none;
        }
        .btn-primary:hover {
            background: #2563eb;
        }
        .btn-secondary {
            background: #f3f4f6;
            color: #4b5563;
            border: 1px solid #e5e7eb;
        }
        .btn-secondary:hover {
            background: #e5e7eb;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-success {
            background: #10b981;
            color: white;
        }
        .btn-success:hover {
            background: #059669;
        }
        .progress-bar {
            transition: width 0.3s ease;
        }
        .tag-tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 1000;
            white-space: pre-line;
            max-width: 300px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            max-height: 80vh;
            overflow-y: auto;
        }
        .compact-tag {
            height: 50px;
            padding: 0.5rem;
        }
        .tag-badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
        }
        .stats-card {
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            border: 1px solid #e5e7eb;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0.5rem;
            border-bottom: 1px solid #e5e7eb;
        }
        .stat-item:last-child {
            border-bottom: none;
        }
        .stat-value {
            font-weight: 600;
            color: #3b82f6;
        }
        .compact-container {
            gap: 0.75rem;
        }
        .selected-tag {
            position: relative;
            transition: all 0.2s ease-in-out;
        }
        .selected-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .unmatched-tag {
            background-color: #f3f4f6; /* gray-100 */
            border: 1px dotted #9ca3af; /* gray-400 */
            color: #4b5563; /* gray-600 */
            transition: all 0.2s ease-in-out;
        }
        .unmatched-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container mx-auto p-4 md:p-5 max-w-[1400px] min-h-screen flex flex-col compact-container">
        <!-- 紧凑的头部区域 -->
        <header class="mb-3 flex justify-between items-center gap-3 p-3 rounded-xl bg-white shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-md bg-blue-500 flex items-center justify-center">
                    <i class="fa-solid fa-tags text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">小河的 Danbooru 标签助手 2.0</h1>
                    <p class="text-xs text-gray-500">高效管理您的标签，提升创作效率</p>
                </div>
            </div>
            <div class="flex-grow max-w-md flex items-center gap-2">
                <div class="relative w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="search" id="search-box" placeholder="搜索标签 (英文/中文/别名/分类/备注)..." class="w-full pl-9 pr-3 h-[36px] border border-gray-300 rounded-md focus:outline-none focus:border-transparent focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm">
                </div>
                <button id="reset-search-btn" title="重置搜索" class="h-[36px] w-10 flex items-center justify-center rounded-md transition-colors duration-200 bg-gray-200 text-gray-700 hover:bg-gray-300">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="flex-shrink-0">
                <!-- 添加固定宽度的占位容器 -->
                <div class="w-[120px]">
                    <button id="reload-app-btn" class="h-[36px] px-3 text-sm flex items-center justify-center gap-2 rounded-md transition-colors duration-200 bg-blue-500 text-white hover:bg-blue-600 hidden">
                        <i class="fa-solid fa-arrows-rotate"></i> 重新加载
                    </button>
                </div>
            </div>
        </header>

        <!-- 加载区域 -->
        <div id="load-area-card" class="mb-3 p-3 bg-white rounded-lg shadow-sm border border-gray-200 space-y-2">
            <div class="space-y-2">
                <div class="flex items-center gap-2">
                    <input type="text" id="csv-url" value="https://raw.githubusercontent.com/xhoxye/BooruTagCart/refs/heads/main/assets/danbooru_all_2.csv" class="w-full px-3 h-[36px] border border-gray-300 rounded-md focus:outline-none focus:border-transparent focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-sm">
                    <button id="reset-url-btn" title="恢复默认URL" class="h-[36px] w-10 flex items-center justify-center rounded-md transition-colors duration-200 bg-gray-200 text-gray-700 hover:bg-gray-300">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <button id="load-url-btn" class="w-full h-[36px] px-3 text-sm flex items-center justify-center gap-2 rounded-md transition-colors duration-200 bg-blue-500 text-white hover:bg-blue-600">
                        <i class="fa-solid fa-cloud-arrow-down"></i> 加载网络文件
                    </button>
                    <label for="local-file-btn" class="w-full cursor-pointer h-[36px] px-3 text-sm flex items-center justify-center gap-2 rounded-md transition-colors duration-200 bg-gray-200 text-gray-700 hover:bg-gray-300">
                        <i class="fa-solid fa-folder-open"></i> 选择本地文件
                    </label>
                    <input type="file" id="local-file-btn" accept=".csv" class="hidden">
                </div>
            </div>
            <div id="status-area" class="text-center">
                <div id="countdown-message" class="text-gray-500 text-sm hidden">
                    将在 <span id="countdown-timer">5</span> 秒后自动加载...
                </div>
                <div id="progress-container" class="w-full bg-gray-200 rounded-full h-2 my-2">
                    <div id="progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300 ease-linear w-0"></div>
                </div>
                <div id="status-message" class="text-xs min-h-[1rem]">准备加载数据</div>
            </div>
        </div>
        
        <div class="flex-grow grid grid-cols-1 md:grid-cols-3 gap-3">
            <!-- 左栏 -->
            <div class="md:col-span-1 flex flex-col gap-3">
                <div class="p-3 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-sm font-semibold text-gray-700">格式化文本</h2>
                        <div id="copy-btn" class="flex items-center gap-1">
                            <button id="copy-text-btn" class="h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md transition-colors duration-200 bg-blue-500 text-white hover:bg-blue-600">
                                <i class="fa-solid fa-copy"></i><span class="hidden sm:inline">复制</span>
                            </button>
                        </div>
                    </div>
                    <div id="format-controls" class="flex flex-wrap items-center gap-1 pb-2">
                        <button data-format="comma-space" class="format-btn h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                            <i class="fa-solid fa-grip-lines"></i><span class="hidden sm:inline">逗号分隔</span>
                        </button>
                        <button data-format="space" class="format-btn h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                            <i class="fa-solid fa-grip-lines-vertical"></i><span class="hidden sm:inline">空格分隔</span>
                        </button>
                        <button data-format="space-underscore" class="format-btn h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                            <i class="fa-solid fa-signature"></i><span class="hidden sm:inline">下划线转空格</span>
                        </button>
                        <button data-format="full" class="format-btn h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                            <i class="fa-solid fa-asterisk"></i><span class="hidden sm:inline">全格式</span>
                        </button>
                    </div>
                    <textarea 
                        id="formatted-output" 
                        readonly 
                        class="w-full bg-gray-900 text-green-400 font-mono rounded-md p-2 text-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 h-32 no-scrollbar resize-none" 
                        placeholder="已选标签组合编辑排序后，格式化文本将显示在这里...">
                    </textarea>

                    <!-- 新增：提示词解析区域 -->
                    <div class="mt-2 pt-2 border-t border-gray-200">
                        <h3 class="text-xs font-semibold text-gray-600 mb-1">粘贴提示词解析</h3>
                        <textarea id="prompt-input" class="w-full bg-gray-100 border border-gray-300 rounded-md p-2 text-sm min-h-[60px] resize-y" placeholder="在此处粘贴提示词，例如：1girl, solo, long hair, masterpiece..."></textarea>
                        <button id="parse-prompt-btn" class="w-full mt-1 h-8 px-3 text-sm flex items-center justify-center gap-2 rounded-md transition-colors duration-200 bg-green-500 text-white hover:bg-green-600">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> 解析为标签
                        </button>
                    </div>
                </div>

                <!-- 标签数据统计区 -->
                <div class="p-3 rounded-lg stats-card shadow-sm">
                    <h2 class="text-sm font-semibold text-gray-700 mb-2">标签统计</h2>
                    <div id="stats-buttons-container" class="grid grid-cols-4 gap-2 text-sm">
                        <button data-category="all" class="stat-button p-2 rounded-md transition-colors duration-200 flex flex-col items-center justify-center bg-gray-200 hover:bg-gray-300 h-16">
                            <span class="font-bold text-blue-600 text-base">0</span>
                            <span class="text-xs flex items-center gap-1 mt-1"><i class="fa-solid fa-globe text-gray-500"></i> 全部</span>
                        </button>
                        <button data-category="0" class="stat-button p-2 rounded-md transition-colors duration-200 flex flex-col items-center justify-center bg-gray-200 hover:bg-gray-300 h-16">
                            <span class="font-bold text-blue-600 text-base">0</span>
                            <span class="text-xs flex items-center gap-1 mt-1"><i class="fa-solid fa-tag text-blue-500"></i> 通用</span>
                        </button>
                        <button data-category="1" class="stat-button p-2 rounded-md transition-colors duration-200 flex flex-col items-center justify-center bg-gray-200 hover:bg-gray-300 h-16">
                            <span class="font-bold text-blue-600 text-base">0</span>
                            <span class="text-xs flex items-center gap-1 mt-1"><i class="fa-solid fa-palette text-red-500"></i> 画师</span>
                        </button>
                        <button data-category="3" class="stat-button p-2 rounded-md transition-colors duration-200 flex flex-col items-center justify-center bg-gray-200 hover:bg-gray-300 h-16">
                            <span class="font-bold text-blue-600 text-base">0</span>
                            <span class="text-xs flex items-center gap-1 mt-1"><i class="fa-solid fa-copyright text-purple-500"></i> 作品</span>
                        </button>
                        <button data-category="4" class="stat-button p-2 rounded-md transition-colors duration-200 flex flex-col items-center justify-center bg-gray-200 hover:bg-gray-300 h-16">
                            <span class="font-bold text-blue-600 text-base">0</span>
                            <span class="text-xs flex items-center gap-1 mt-1"><i class="fa-solid fa-user text-green-500"></i> 角色</span>
                        </button>
                        <button data-category="5" class="stat-button p-2 rounded-md transition-colors duration-200 flex flex-col items-center justify-center bg-gray-200 hover:bg-gray-300 h-16">
                            <span class="font-bold text-blue-600 text-base">0</span>
                            <span class="text-xs flex items-center gap-1 mt-1"><i class="fa-solid fa-info-circle text-orange-500"></i> 元数据</span>
                        </button>
                        <button data-category="6" class="stat-button p-2 rounded-md transition-colors duration-200 flex flex-col items-center justify-center bg-gray-200 hover:bg-gray-300 h-16">
                            <span class="font-bold text-blue-600 text-base">0</span>
                            <span class="text-xs flex items-center gap-1 mt-1"><i class="fa-solid fa-cogs text-pink-500"></i> Kontext</span>
                        </button>
                    </div>
                </div>
                
                <!-- 标签详情区 - 添加固定高度的占位容器 -->
                <div class="min-h-[215px]">
                    <div id="tag-details-card" class="p-3 rounded-lg bg-white shadow-sm border border-gray-200 hidden">
                        <h2 class="text-sm font-semibold text-gray-700 mb-2">标签详情</h2>
                        <div id="tag-details-content" class="text-xs space-y-1">
                            <p>请从下方列表中选择一个标签以查看其详细信息。</p>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 右栏 -->
            <div class="md:col-span-2 flex flex-col gap-3">
                <div class="p-3 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-sm font-semibold text-gray-700">已选标签 (<span id="selected-count">0</span>) 个，可拖拽排序、点击取消选择</h2>
                        <div class="flex items-center gap-1">
                            <button id="toggle-lang-btn" class="h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md transition-colors duration-200 bg-gray-200 text-gray-700 hover:bg-gray-300">
                                <i class="fa-solid fa-language"></i> 切换中英文
                            </button>
                            <button id="save-wildcard-btn" class="h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md transition-colors duration-200 bg-gray-200 text-gray-700 hover:bg-gray-300">
                                <i class="fa-solid fa-save"></i> 保存为通配符
                            </button>
                            <button id="clear-selected-btn" class="h-7 px-2 text-xs flex items-center justify-center gap-1 rounded-md transition-colors duration-200 bg-gray-200 text-gray-700 hover:bg-gray-300">
                                <i class="fa-solid fa-trash-can"></i> 清空已选
                            </button>
                        </div>
                    </div>
                    <div id="selected-tags-container" class="flex-grow min-h-[135px] bg-gray-100 rounded-md p-2 flex flex-wrap content-start gap-1 overflow-y-auto">
                        <div class="flex flex-col items-center justify-center w-full h-full text-gray-400">
                            <i class="fa-solid fa-tags text-3xl mb-2"></i>
                            <p class="text-sm">尚未选择任何标签</p>
                        </div>
                    </div>
                </div>
                
                <!-- 标签列表区域（紧凑布局） -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-3 flex flex-col overflow-hidden">
                    <!-- 紧凑的分类过滤器 -->
                    <div id="category-filters" class="flex flex-wrap items-center gap-1 pb-2">
                        <button id="all-categories" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                            <i class="fa-solid fa-globe w-3 text-center"></i><span>全部</span>
                        </button>
                        <button data-category="0" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                            <i class="fa-solid fa-tag w-3 text-center"></i><span>通用</span>
                        </button>
                        <button data-category="1" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                            <i class="fa-solid fa-palette w-3 text-center"></i><span>画师</span>
                        </button>
                        <button data-category="3" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                            <i class="fa-solid fa-copyright w-3 text-center"></i><span>作品</span>
                        </button>
                        <button data-category="4" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                            <i class="fa-solid fa-user w-3 text-center"></i><span>角色</span>
                        </button>
                        <button data-category="5" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                            <i class="fa-solid fa-info-circle w-3 text-center"></i><span>元数据</span>
                        </button>
                        <button data-category="6" class="category-btn h-7 px-2 text-xs min-w-[50px] flex items-center justify-center gap-1 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300">
                            <i class="fa-solid fa-cogs w-3 text-center"></i><span>Kontext</span>
                        </button>
                    </div>
                    
                    <div id="tag-list-container" class="flex-grow overflow-hidden no-scrollbar py-1 p-1 min-h-[400px]">
                        <div id="tag-list" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-4 2xl:grid-cols-4 gap-2"></div>
                    </div>
                    
                    <div id="pagination-controls" class="mt-2 pt-2 border-t border-gray-200 flex justify-center items-center gap-2 text-xs"></div>
                </div>
            </div>
        </div>

        <footer class="text-center mt-auto pt-3 text-xs text-gray-500">
            <p>© 2025 / <a href="https://xhoxye.github.io/BooruTagCart/" target="_blank">小河的 Danbooru 标签助手 / BooruTagCart / v 2.0.0 / by xhox</a>
            <a href="https://space.bilibili.com/14701583" target="_blank" class="ml-2 text-xl" style="color:#3B82F6"><i class="fab fa-bilibili"></i></a> 
            <a href="https://github.com/xhoxye/BooruTagCart" target="_blank" class="ml-2 text-xl" style="color:#3B82F6"><i class="fab fa-github"></i></a> 
            <a href="https://pan.baidu.com/s/1T7WzVhwnAkcGY-3oWP50VQ?pwd=xhox" target="_blank" class="ml-2 text-xl" style="color:#3B82F6"><i class="fa-solid fa-download text-xl text-[#3b82f6]"></i></a>
            </p>
        </footer>
    </div>

    <!-- 标签提示工具 -->
    <div id="tag-tooltip" class="tag-tooltip"></div>

    <script>
        // 模块化组织代码
        const TagAssistant = (() => {
            // 常量定义
            const DEFAULT_URL = 'https://raw.githubusercontent.com/xhoxye/BooruTagCart/refs/heads/main/assets/danbooru_all_2.csv';
            const TAGS_PER_PAGE = 28;
            const CATEGORY_MAP = {
                '0': { name: '通用', icon: 'fa-tag', color: 'blue', bg: 'bg-blue-100', text: 'text-blue-800', border: 'border-blue-200' },
                '1': { name: '画师', icon: 'fa-palette', color: 'red', bg: 'bg-red-100', text: 'text-red-800', border: 'border-red-200' },
                '3': { name: '作品', icon: 'fa-copyright', color: 'purple', bg: 'bg-purple-100', text: 'text-purple-800', border: 'border-purple-200' },
                '4': { name: '角色', icon: 'fa-user', color: 'green', bg: 'bg-green-100', text: 'text-green-800', border: 'border-green-200' },
                '5': { name: '元数据', icon: 'fa-info-circle', color: 'orange', bg: 'bg-orange-100', text: 'text-orange-800', border: 'border-orange-200' },
                '6': { name: 'Kontext', icon: 'fa-cogs', color: 'pink', bg: 'bg-pink-100', text: 'text-pink-800', border: 'border-pink-200' }
            };
            
            // DOM元素
            const elements = {
                csvUrlInput: document.getElementById('csv-url'),
                loadUrlBtn: document.getElementById('load-url-btn'),
                localFileBtn: document.getElementById('local-file-btn'),
                resetUrlBtn: document.getElementById('reset-url-btn'),
                searchBox: document.getElementById('search-box'),
                resetSearchBtn: document.getElementById('reset-search-btn'),
                categoryFilters: document.getElementById('category-filters'),
                countdownMessage: document.getElementById('countdown-message'),
                countdownTimer: document.getElementById('countdown-timer'),
                progressContainer: document.getElementById('progress-container'),
                progressBar: document.getElementById('progress-bar'),
                statusMessage: document.getElementById('status-message'),
                tagList: document.getElementById('tag-list'),
                tagListContainer: document.getElementById('tag-list-container'),
                paginationControls: document.getElementById('pagination-controls'),
                loadAreaCard: document.getElementById('load-area-card'),
                reloadAppBtn: document.getElementById('reload-app-btn'),
                selectedTagsContainer: document.getElementById('selected-tags-container'),
                toggleLangBtn: document.getElementById('toggle-lang-btn'),
                clearSelectedBtn: document.getElementById('clear-selected-btn'),
                saveWildcardBtn: document.getElementById('save-wildcard-btn'),
                formattedOutput: document.getElementById('formatted-output'),
                formatControls: document.getElementById('format-controls'),
                copyTextBtn: document.getElementById('copy-text-btn'),
                selectedCount: document.getElementById('selected-count'),
                allCategoriesBtn: document.getElementById('all-categories'),
                tagTooltip: document.getElementById('tag-tooltip'),
                statsButtonsContainer: document.getElementById('stats-buttons-container'),
                tagDetailsCard: document.getElementById('tag-details-card'),
                tagDetailsContent: document.getElementById('tag-details-content'),
                promptInput: document.getElementById('prompt-input'),
                parsePromptBtn: document.getElementById('parse-prompt-btn')
            };
            
            // 状态变量
            let state = {
                allTags: [],
                filteredTags: [],
                selectedTags: [],
                currentPage: 1,
                currentCategory: 'all',
                currentFormat: 'space-underscore',
                selectedTagsLanguage: 'cn',
                countdownInterval: null,
                mainSortable: null,
                selectedSortable: null,
                categoryCounts: {
                    '0': 0,
                    '1': 0,
                    '3': 0,
                    '4': 0,
                    '5': 0,
                    '6': 0
                },
                tooltipTimeout: null
            };
            
            // 工具函数
            const utils = {
                debounce: (func, delay) => {
                    let timeout;
                    return function(...args) {
                        clearTimeout(timeout);
                        timeout = setTimeout(() => func.apply(this, args), delay);
                    };
                },
                
                formatPopularity: (numStr) => {
                    const num = parseInt(numStr, 10);
                    if (isNaN(num)) return '0';
                    if (num >= 1000000) return `${(num / 1000000).toFixed(1).replace(/\.0$/, '')}M`;
                    if (num >= 1000) return `${(num / 1000).toFixed(1).replace(/\.0$/, '')}K`;
                    return num.toString();
                },
                
                showTooltip: (content, x, y) => {
                    elements.tagTooltip.textContent = content;
                    
                    // 计算最大可显示位置
                    const maxX = window.innerWidth - elements.tagTooltip.offsetWidth - 20;
                    const maxY = window.innerHeight - elements.tagTooltip.offsetHeight - 20;
                    
                    // 确保提示框不会超出屏幕
                    const adjustedX = Math.min(x + 10, maxX);
                    const adjustedY = Math.min(y + 10, maxY);
                    
                    elements.tagTooltip.style.left = `${adjustedX}px`;
                    elements.tagTooltip.style.top = `${adjustedY}px`;
                    elements.tagTooltip.style.opacity = '1';
                },
                
                hideTooltip: () => {
                    elements.tagTooltip.style.opacity = '0';
                },
                
                debounceShowTooltip: (content, x, y) => {
                    // 清除之前的定时器
                    clearTimeout(state.tooltipTimeout);
                    
                    // 设置新的定时器
                    state.tooltipTimeout = setTimeout(() => {
                        utils.showTooltip(content, x, y);
                    }, 300);
                },
                
                cancelShowTooltip: () => {
                    clearTimeout(state.tooltipTimeout);
                    utils.hideTooltip();
                },
                
                stopCountdown: () => {
                    if (state.countdownInterval) {
                        clearInterval(state.countdownInterval);
                        elements.countdownMessage.classList.add('hidden');
                    }
                },
                
                updateStats: () => {
                    if (state.allTags.length === 0) return;

                    // 重置计数
                    state.categoryCounts = { '0': 0, '1': 0, '3': 0, '4': 0, '5': 0, '6': 0 };
                    
                    // 计算每个类别的数量
                    state.allTags.forEach(tag => {
                        const catId = tag[1];
                        if (state.categoryCounts.hasOwnProperty(catId)) {
                            state.categoryCounts[catId]++;
                        }
                    });

                    // 更新UI
                    const buttons = elements.statsButtonsContainer.querySelectorAll('.stat-button');
                    buttons.forEach(btn => {
                        const category = btn.dataset.category;
                        const countSpan = btn.querySelector('span.font-bold');
                        let count = 0;
                        if (category === 'all') {
                            count = state.allTags.length;
                        } else if (state.categoryCounts[category]) {
                            count = state.categoryCounts[category];
                        }
                        countSpan.textContent = count.toLocaleString();
                    });
                }
            };
            
            // 数据加载模块
            const dataLoader = {
                loadFile: async (source) => {
                    // 重置状态
                    state.allTags = [];
                    state.filteredTags = [];
                    state.selectedTags = [];
                    state.currentPage = 1;
                    
                    elements.tagList.innerHTML = '';
                    elements.paginationControls.innerHTML = '';
                    tagRenderer.renderSelectedTags(); // 确保占位符在加载时正确显示
                    elements.formattedOutput.value = '';
                    elements.selectedCount.textContent = '0';
                    
                    // 隐藏重新加载按钮
                    elements.reloadAppBtn.classList.add('hidden');
                    
                    if (typeof source === 'string') {
                        await dataLoader.loadNetworkFile(source);
                    } else {
                        dataLoader.parseCsvData(source, '本地文件');
                    }
                },
                
                loadNetworkFile: async (url) => {
                    try {
                        elements.statusMessage.textContent = '正在连接服务器...';
                        elements.progressBar.style.width = '0%';
                        
                        const response = await fetch(url);
                        
                        if (!response.ok) {
                            throw new Error(`网络错误: ${response.status} ${response.statusText}`);
                        }
                        
                        if (!response.body) {
                            throw new Error('响应中没有数据体');
                        }
                        
                        const contentLength = response.headers.get('content-length');
                        const totalSize = parseInt(contentLength, 10);
                        let receivedLength = 0;
                        const chunks = [];
                        const reader = response.body.getReader();
                        
                        elements.statusMessage.textContent = '正在下载文件...';
                        
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            
                            chunks.push(value);
                            receivedLength += value.length;
                            
                            if (totalSize) {
                                const progress = Math.round((receivedLength / totalSize) * 100);
                                elements.progressBar.style.width = `${progress}%`;
                            }
                        }
                        
                        const blob = new Blob(chunks);
                        dataLoader.parseCsvData(blob, '网络文件');
                    } catch (error) {
                        elements.statusMessage.textContent = `加载失败: ${error.message}`;
                        elements.statusMessage.classList.add('text-red-500');
                    }
                },
                
                parseCsvData: (data, sourceName) => {
                    const startTime = performance.now();
                    elements.statusMessage.textContent = '开始解析数据...';
                    
                    Papa.parse(data, {
                        header: false,
                        skipEmptyLines: true,
                        chunk: (results, parser) => {
                            state.allTags = [...state.allTags, ...results.data];
                            const rowCount = state.allTags.length;
                            const progress = Math.min((rowCount / 160000) * 100, 100);
                            elements.progressBar.style.width = `${progress}%`;
                            elements.statusMessage.textContent = `已解析 ${rowCount.toLocaleString()} 行...`;
                        },
                        complete: () => {
                            // 排序: 按热度从高到低
                            state.allTags.sort((a, b) => (parseInt(b[2], 10) || 0) - (parseInt(a[2], 10) || 0));
                            
                            const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                            elements.progressBar.style.width = '100%';
                            
                            tagManager.applyFilters();
                            utils.updateStats();
                            
                            const finalMessage = `${sourceName}加载完成！共 ${state.allTags.length.toLocaleString()} 个标签，耗时 ${duration} 秒。`;
                            elements.statusMessage.textContent = finalMessage;
                            
                            // 隐藏加载区
                            setTimeout(() => {
                                elements.loadAreaCard.classList.add('hidden');
                                elements.reloadAppBtn.classList.remove('hidden'); // 加载完成后显示重新加载按钮
                            }, 2000);
                            
                            // 初始化拖拽排序
                            initSortable();
                            
                            // 显示重新加载按钮
                            // elements.reloadAppBtn.classList.remove('hidden');
                        },
                        error: (error) => {
                            elements.statusMessage.textContent = `解析失败: ${error.message}`;
                            elements.statusMessage.classList.add('text-red-500');
                            
                            // 显示重新加载按钮
                            elements.reloadAppBtn.classList.remove('hidden');
                        }
                    });
                },
                
                startCountdown: (seconds = 5) => {
                    let countdown = seconds;
                    elements.countdownMessage.classList.remove('hidden');
                    elements.countdownTimer.textContent = countdown;
                    
                    state.countdownInterval = setInterval(() => {
                        countdown--;
                        elements.countdownTimer.textContent = countdown;
                        
                        if (countdown <= 0) {
                            clearInterval(state.countdownInterval);
                            dataLoader.loadFile(DEFAULT_URL);
                        }
                    }, 1000);
                }
            };
            
            // 标签渲染模块
            const tagRenderer = {
                renderTagList: () => {
                    elements.tagList.innerHTML = '';
                    
                    const startIndex = (state.currentPage - 1) * TAGS_PER_PAGE;
                    const endIndex = Math.min(startIndex + TAGS_PER_PAGE, state.filteredTags.length);
                    const visibleTags = state.filteredTags.slice(startIndex, endIndex);
                    
                    if (visibleTags.length === 0) {
                        elements.tagList.innerHTML = `
                            <div class="col-span-full text-center py-10 text-gray-500">
                                <i class="fa-solid fa-inbox text-3xl mb-3"></i>
                                <p class="text-base">没有找到匹配的标签</p>
                                <p class="mt-1 text-sm">尝试修改搜索条件或选择其他分类</p>
                            </div>
                        `;
                        return;
                    }
                    
                    visibleTags.forEach(tag => {
                        const [enTag, catId, pop, alias, cnTag, l1, l2, notes] = tag;
                        const isSelected = state.selectedTags.some(t => t[0] === enTag);
                        const category = CATEGORY_MAP[catId] || CATEGORY_MAP['0'];
                        
                        // 创建标签详细信息（用于悬停提示）
                        const details = [
                            `英文: ${enTag || 'N/A'}`,
                            `中文: ${cnTag || '无'}`,
                            `别名: ${alias || '无'}`,
                            `热度: ${pop || '0'}`,
                            `类别: ${category.name}`,
                            `一级分类: ${l1 || '无'}`,
                            `二级分类: ${l2 || '无'}`,
                            `备注: ${notes || '无'}`
                        ].join('\n');
                        
                        const tagEl = document.createElement('div');
                        tagEl.className = `tag-item compact-tag p-2 rounded-md flex items-center justify-between ${category.bg} ${category.text} hover:ring-1 hover:ring-offset-1 hover:ring-${category.color}-400 text-sm ${isSelected ? 'tag-selected' : ''}`;
                        tagEl.innerHTML = `
                            <div class="flex items-center overflow-hidden mr-2">
                                <i class="fa-solid ${category.icon} w-3 text-center mr-2"></i>
                                <div class="overflow-hidden">
                                    <p class="font-semibold truncate text-xs">${cnTag || enTag}</p>
                                    ${cnTag ? `<p class="text-2xs ${category.text} opacity-80 truncate">${enTag}</p>` : ''}
                                </div>
                            </div>
                            <div class="text-2xs font-mono bg-white/60 px-1 py-0.5 rounded tag-badge">${utils.formatPopularity(pop)}</div>
                        `;
                        
                        tagEl.dataset.enTag = enTag;
                        tagEl.dataset.details = details;
                        
                        // 添加悬停提示
                        tagEl.addEventListener('mouseenter', (e) => {
                            utils.debounceShowTooltip(details, e.clientX, e.clientY);
                        });
                        
                        tagEl.addEventListener('mouseleave', () => {
                            utils.cancelShowTooltip();
                        });
                        
                        tagEl.addEventListener('click', () => {
                            tagManager.toggleTagSelection(tag, tagEl);
                            tagDetails.show(tag);
                        });
                        
                        elements.tagList.appendChild(tagEl);
                    });
                    
                    tagRenderer.renderPagination();
                },
                
                renderSelectedTags: () => {
                    elements.selectedTagsContainer.innerHTML = '';
                    elements.selectedCount.textContent = state.selectedTags.length;
                    
                    if (state.selectedTags.length === 0) {
                        elements.selectedTagsContainer.innerHTML = `
                            <div class="flex flex-col items-center justify-center w-full h-full text-gray-400 p-4 text-center">
                                <i class="fa-solid fa-hand-pointer text-3xl mb-2"></i>
                                <p class="text-sm font-semibold">这里是已选标签区</p>
                                <p class="text-xs mt-1">您可以从下方的“标签列表”点击添加标签，或在左侧“格式化文本”区粘贴并解析您的提示词。</p>
                            </div>
                        `;
                        
                        // 修复：清空已选标签时更新格式化输出
                        formatter.updateFormattedOutput();
                        return;
                    }
                    
                    state.selectedTags.forEach(tag => {
                        const isUnmatched = !tag[1]; // 未匹配的标签没有类别ID
                        const enTag = tag[0];
                        
                        let displayText, category, details, tagElClass;

                        if (isUnmatched) {
                            displayText = enTag;
                            details = `未匹配标签: ${enTag}`;
                            tagElClass = `unmatched-tag h-[32px] px-2 flex items-center justify-between gap-1 rounded-md shadow-sm border min-w-[60px] max-w-[180px] text-xs font-bold`;
                        } else {
                            const [_, catId, pop, alias, cnTag, l1, l2, notes] = tag;
                            displayText = state.selectedTagsLanguage === 'cn' ? (cnTag || enTag) : enTag;
                            category = CATEGORY_MAP[catId] || CATEGORY_MAP['0'];
                            details = [
                                `英文: ${enTag || 'N/A'}`,
                                `中文: ${cnTag || '无'}`,
                                `别名: ${alias || '无'}`,
                                `热度: ${pop || '0'}`,
                                `类别: ${category.name}`,
                                `一级分类: ${l1 || '无'}`,
                                `二级分类: ${l2 || '无'}`,
                                `备注: ${notes || '无'}`
                            ].join('\n');
                            tagElClass = `selected-tag h-[32px] px-2 flex items-center justify-between gap-1 rounded-md shadow-sm border ${category.border} ${category.bg} ${category.text} min-w-[60px] max-w-[180px] text-xs font-bold`;
                        }
                        
                        const tagEl = document.createElement('div');
                        tagEl.className = tagElClass;
                        tagEl.innerHTML = `
                            <span class="truncate">${displayText}</span>
                            <button class="remove-selected-tag-btn font-bold text-lg leading-none ${isUnmatched ? 'text-red-700' : `text-${category.color}-500 hover:text-${category.color}-700`}">×</button>
                        `;
                        
                        tagEl.dataset.enTag = enTag;
                        tagEl.dataset.details = details;
                        
                        // 添加悬停提示
                        tagEl.addEventListener('mouseenter', (e) => {
                            utils.debounceShowTooltip(details, e.clientX, e.clientY);
                        });
                        
                        tagEl.addEventListener('mouseleave', () => {
                            utils.cancelShowTooltip();
                        });
                        
                        tagEl.querySelector('.remove-selected-tag-btn').addEventListener('click', e => { 
                            e.stopPropagation(); 
                            const mainListEl = findTagElementInMainList(enTag);
                            tagManager.toggleTagSelection(tag, mainListEl);
                        });
                        
                        elements.selectedTagsContainer.appendChild(tagEl);
                    });
                    
                    formatter.updateFormattedOutput();
                },
                
                renderPagination: () => {
                    elements.paginationControls.innerHTML = '';
                    const totalPages = Math.ceil(state.filteredTags.length / TAGS_PER_PAGE);
                    
                    if (totalPages <= 1) return;
                    
                    const createButton = (icon, page, disabled = false) => {
                        const button = document.createElement('button');
                        button.className = `pagination-btn px-2 py-1 bg-white border border-gray-300 rounded-md hover:bg-gray-100 transition-colors text-xs ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`;
                        button.innerHTML = `<i class="fa-solid ${icon}"></i>`;
                        button.disabled = disabled;
                        button.dataset.page = page;
                        return button;
                    };
                    
                    elements.paginationControls.appendChild(createButton('fa-angles-left', 1, state.currentPage === 1));
                    elements.paginationControls.appendChild(createButton('fa-angle-left', state.currentPage - 1, state.currentPage === 1));
                    
                    const pageInfo = document.createElement('span');
                    pageInfo.className = 'px-2 text-gray-600 text-xs';
                    pageInfo.textContent = `第 ${state.currentPage} / ${totalPages} 页`;
                    elements.paginationControls.appendChild(pageInfo);
                    
                    elements.paginationControls.appendChild(createButton('fa-angle-right', state.currentPage + 1, state.currentPage === totalPages));
                    elements.paginationControls.appendChild(createButton('fa-angles-right', totalPages, state.currentPage === totalPages));
                }
            };
            
            // 标签管理模块
            const tagManager = {
                toggleTagSelection: (tag, element) => {
                    const enTag = tag[0];
                    const index = state.selectedTags.findIndex(t => t[0] === enTag);
                    
                    if (index > -1) {
                        state.selectedTags.splice(index, 1);
                        if (element) element.classList.remove('tag-selected');
                    } else {
                        state.selectedTags.push(tag);
                        if (element) element.classList.add('tag-selected');
                    }
                    
                    tagRenderer.renderSelectedTags();
                },
                
                clearSelectedTags: () => {
                    state.selectedTags = [];
                    document.querySelectorAll('.tag-item').forEach(el => {
                        el.classList.remove('tag-selected');
                    });
                    tagRenderer.renderSelectedTags();
                    tagDetails.hide();
                },
                
                applyFilters: () => {
                    const query = elements.searchBox.value.toLowerCase().trim();
                    
                    state.filteredTags = state.allTags.filter(tag => {
                        // 按类别过滤
                        if (state.currentCategory !== 'all' && tag[1] !== state.currentCategory) {
                            return false;
                        }
                        
                        // 按搜索词过滤
                        if (query) {
                            const searchText = `${tag[0]} ${tag[4]} ${tag[3]} ${tag[1]} ${tag[5]} ${tag[6]} ${tag[7]}`.toLowerCase();
                            return searchText.includes(query);
                        }
                        
                        return true;
                    });
                    
                    state.currentPage = 1;
                    tagRenderer.renderTagList();
                }
            };

            // 标签详情模块
            const tagDetails = {
                show: (tag) => {
                    const [enTag, catId, pop, alias, cnTag, l1, l2, notes] = tag;
                    const category = CATEGORY_MAP[catId] || CATEGORY_MAP['0'];

                    const detailsHtml = `
                        <p><strong>英文:</strong> <span class="font-mono text-blue-600">${enTag || 'N/A'}</span></p>
                        <p><strong>中文:</strong> ${cnTag || '无'}</p>
                        <p><strong>类别:</strong> <span class="font-semibold" style="color: ${category.color}">${category.name}</span></p>
                        <p><strong>热度:</strong> ${pop ? parseInt(pop).toLocaleString() : '0'}</p>
                        <p><strong>别名:</strong> ${alias || '无'}</p>
                        <p><strong>一级分类:</strong> ${l1 || '无'}</p>
                        <p><strong>二级分类:</strong> ${l2 || '无'}</p>
                        <p><strong>备注:</strong> ${notes || '无'}</p>
                    `;

                    elements.tagDetailsContent.innerHTML = detailsHtml;
                    elements.tagDetailsCard.classList.remove('hidden');
                },
                hide: () => {
                    elements.tagDetailsCard.classList.add('hidden');
                }
            };
            
            // 格式化模块
            const formatter = {
                updateFormattedOutput: () => {
                    let output = '';
                    const tags = state.selectedTags.map(row => row[0]);
                    
                    switch(state.currentFormat) {
                        case 'comma-space':
                            output = tags.join(', ');
                            break;
                        case 'space':
                            output = tags.join(' ');
                            break;
                        case 'space-underscore':
                            output = tags.map(tag => tag.replace(/_/g, ' ')).join(', ');
                            break;
                        case 'full':
                            output = tags.map(tag => `(${tag.replace(/_/g, ' ')}:1.1)`).join(', ');
                            break;
                    }
                    
                    elements.formattedOutput.value = output;
                },
                
                copyToClipboard: () => {
                    if (!elements.formattedOutput.value) return;
                    
                    elements.formattedOutput.select();
                    navigator.clipboard.writeText(elements.formattedOutput.value).then(() => {
                        const originalText = '复制';
                        elements.copyTextBtn.innerHTML = `<i class="fa-solid fa-check"></i><span class="hidden sm:inline">已复制!</span>`;
                        elements.copyTextBtn.classList.add('bg-green-500', 'hover:bg-green-600');
                        elements.copyTextBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
                        
                        setTimeout(() => {
                            elements.copyTextBtn.innerHTML = `<i class="fa-solid fa-copy"></i><span class="hidden sm:inline">${originalText}</span>`;
                            elements.copyTextBtn.classList.add('bg-blue-500', 'hover:bg-blue-600');
                            elements.copyTextBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
                        }, 2000);
                    });
                },
                
                saveAsWildcard: () => {
                    if (state.selectedTags.length === 0) return;
                    
                    const content = state.selectedTags.map(tag => tag[0]).join('\n');
                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const link = document.createElement('a');
                    
                    link.href = URL.createObjectURL(blob);
                    link.download = 'danbooru_tags.txt';
                    link.click();
                    URL.revokeObjectURL(link.href);
                }
            };
            
            // 初始化拖拽排序
            const initSortable = () => {
                if (typeof Sortable === 'undefined') return;
                
                // 主标签列表
                state.mainSortable = new Sortable(elements.tagList, {
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    group: 'shared'
                });
                
                // 已选标签列表
                state.selectedSortable = new Sortable(elements.selectedTagsContainer, {
                    animation: 150,
                    group: 'shared',
                    onEnd: (evt) => {
                        const newOrder = Array.from(evt.to.children).map(el => {
                            const enTag = el.dataset.enTag;
                            return state.selectedTags.find(tag => tag[0] === enTag);
                        }).filter(tag => tag);
                        
                        state.selectedTags = newOrder;
                        tagRenderer.renderSelectedTags();
                    }
                });
            };
            
            // 辅助函数
            const findTagElementInMainList = (enTag) => {
                return elements.tagList.querySelector(`[data-en-tag="${enTag}"]`);
            };
            
            const updateCategoryButtonStyles = () => {
                elements.categoryFilters.querySelectorAll('button').forEach(btn => {
                    btn.classList.remove('bg-blue-500', 'text-white', 'hover:bg-blue-600');
                    btn.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                    
                    if ((btn === elements.allCategoriesBtn && state.currentCategory === 'all') || 
                        btn.dataset.category === state.currentCategory) {
                        btn.classList.add('bg-blue-500', 'text-white', 'hover:bg-blue-600');
                        btn.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                    }
                });
            };
            
            const updateFormatButtonStyles = () => {
                elements.formatControls.querySelectorAll('.format-btn').forEach(btn => {
                    btn.classList.remove('bg-blue-500', 'text-white', 'hover:bg-blue-600');
                    btn.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                    
                    if (btn.dataset.format === state.currentFormat) {
                        btn.classList.add('bg-blue-500', 'text-white', 'hover:bg-blue-600');
                        btn.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                    }
                });
            };
            
            // 提示词解析模块
            const promptParser = {
                parse: () => {
                    const text = elements.promptInput.value.trim();
                    if (!text) return;

                    // 首先清空当前所有已选标签
                    tagManager.clearSelectedTags();

                    // 智能检测分隔符
                    const separator = text.includes(',') ? /,\s*/ : /\s+/;
                    const rawTags = text.split(separator).filter(t => t);

                    rawTags.forEach(rawTag => {
                        // 规范化输入，将空格替换为下划线，并转为小写
                        const normalizedTag = rawTag.trim().replace(/\s+/g, '_').toLowerCase();
                        if (!normalizedTag) return;

                        // 检查是否已选择
                        if (state.selectedTags.some(t => t[0].toLowerCase() === normalizedTag)) {
                            return; // 如果已存在，则跳过
                        }

                        // 尝试在 allTags 中精确查找
                        let foundTag = state.allTags.find(t => t[0].toLowerCase() === normalizedTag);

                        // 如果找不到，创建未匹配标签对象
                        if (!foundTag) {
                            foundTag = [rawTag.trim(), null]; // 使用原始输入作为显示，标记为未匹配
                        }

                        state.selectedTags.push(foundTag);
                        
                        // 更新主列表中的视觉状态
                        const mainListEl = findTagElementInMainList(foundTag[0]);
                        if (mainListEl) {
                            mainListEl.classList.add('tag-selected');
                        }
                    });

                    tagRenderer.renderSelectedTags();
                    elements.promptInput.value = ''; // 清空输入框
                }
            };

            // 事件处理模块
            const eventHandler = {
                init: () => {
                    // 搜索框事件
                    elements.searchBox.addEventListener('input', utils.debounce(() => {
                        tagManager.applyFilters();
                    }, 300));
                    
                    // 重置搜索按钮
                    elements.resetSearchBtn.addEventListener('click', () => {
                        elements.searchBox.value = '';
                        state.currentCategory = 'all';
                        updateCategoryButtonStyles();
                        tagManager.applyFilters();
                    });
                    
                    // 分类过滤事件
                    elements.categoryFilters.addEventListener('click', e => {
                        const btn = e.target.closest('button');
                        if (!btn) return;
                        
                        if (btn === elements.allCategoriesBtn) {
                            state.currentCategory = 'all';
                        } else if (btn.dataset.category) {
                            state.currentCategory = btn.dataset.category;
                        }
                        
                        updateCategoryButtonStyles();
                        tagManager.applyFilters();
                    });

                    // 统计按钮事件
                    elements.statsButtonsContainer.addEventListener('click', e => {
                        const btn = e.target.closest('.stat-button');
                        if (!btn) return;

                        const category = btn.dataset.category;
                        state.currentCategory = category;
                        
                        updateCategoryButtonStyles();
                        tagManager.applyFilters();
                    });
                    
                    // 格式化按钮事件
                    elements.formatControls.addEventListener('click', e => {
                        const btn = e.target.closest('.format-btn');
                        if (!btn) return;
                        
                        state.currentFormat = btn.dataset.format;
                        updateFormatButtonStyles();
                        formatter.updateFormattedOutput();
                    });
                    
                    // 按钮事件
                    elements.loadUrlBtn.addEventListener('click', () => {
                        utils.stopCountdown();
                        const url = elements.csvUrlInput.value.trim() || DEFAULT_URL;
                        dataLoader.loadFile(url);
                    });                     
                    
                    // 本地文件选择按钮事件（增加打断事件）
                    elements.localFileBtn.addEventListener('click', (e) => {
                        utils.stopCountdown();
                    });
                    
                    elements.localFileBtn.addEventListener('change', (e) => {
                        utils.stopCountdown(); // 停止倒计时
                        if (e.target.files.length > 0) {
                            // 直接加载选中的文件
                            dataLoader.loadFile(e.target.files[0]);
                            // 修复：重置文件输入，允许再次选择同一文件
                            e.target.value = '';
                        }
                    });
                    
                    elements.csvUrlInput.addEventListener('input', () => {
                        utils.stopCountdown();
                    });
                    
                    elements.resetUrlBtn.addEventListener('click', () => {
                        utils.stopCountdown();
                        elements.csvUrlInput.value = DEFAULT_URL;
                    });
                    
                    elements.toggleLangBtn.addEventListener('click', () => {
                        state.selectedTagsLanguage = state.selectedTagsLanguage === 'cn' ? 'en' : 'cn';
                        tagRenderer.renderSelectedTags();
                    });
                    
                    elements.clearSelectedBtn.addEventListener('click', tagManager.clearSelectedTags);
                    elements.copyTextBtn.addEventListener('click', formatter.copyToClipboard);
                    elements.saveWildcardBtn.addEventListener('click', formatter.saveAsWildcard);
                    elements.parsePromptBtn.addEventListener('click', promptParser.parse);
                    
                    elements.reloadAppBtn.addEventListener('click', () => {
                        // 重置应用
                        state = {
                            allTags: [],
                            filteredTags: [],
                            selectedTags: [],
                            currentPage: 1,
                            currentCategory: 'all',
                            currentFormat: 'space-underscore',
                            selectedTagsLanguage: 'cn',
                            categoryCounts: {
                                '0': 0,
                                '1': 0,
                                '3': 0,
                                '4': 0,
                                '5': 0,
                                '6': 0
                            },
                            tooltipTimeout: null
                        };
                        updateCategoryButtonStyles();
                        
                        elements.selectedCount.textContent = '0';
                        elements.formattedOutput.value = '';
                        elements.searchBox.value = '';
                        elements.tagList.innerHTML = '';
                        elements.paginationControls.innerHTML = '';
                        elements.selectedTagsContainer.innerHTML = '';
                        
                        // 更新统计区域并隐藏详情卡
                        utils.updateStats();
                        tagDetails.hide();
                        
                        // 显示加载区
                        elements.loadAreaCard.classList.remove('hidden');
                        elements.progressBar.style.width = '0%';
                        elements.statusMessage.textContent = '准备加载数据...';
                        
                        // 隐藏重新加载按钮
                        elements.reloadAppBtn.classList.add('hidden');
                        
                        // 开始倒计时
                        dataLoader.startCountdown();
                    });
                    
                    // 分页事件
                    elements.paginationControls.addEventListener('click', e => {
                        const btn = e.target.closest('.pagination-btn');
                        if (!btn || btn.disabled) return;
                        
                        state.currentPage = Number(btn.dataset.page);
                        tagRenderer.renderTagList();
                    });
                    
                    // 初始选择默认按钮
                    updateFormatButtonStyles();
                    updateCategoryButtonStyles();
                    
                    // 鼠标移动时更新提示位置
                    document.addEventListener('mousemove', (e) => {
                        if (elements.tagTooltip.style.opacity === '1') {
                            utils.showTooltip(elements.tagTooltip.textContent, e.clientX, e.clientY);
                        }
                    });
                    
                    // 开始倒计时
                    dataLoader.startCountdown();
                }
            };
            
            // 公开方法
            return {
                init: () => {
                    eventHandler.init();
                }
            };
        })();
        
        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            TagAssistant.init();
        });
    </script>
</body>
</html>
